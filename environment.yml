# Validated on Windows x86_64 with an NVIDIA GPU: ENV-1 CUDA, 2026-10-06.
# Run conda env create -f environment.yml from the repository root.
# Project requirements define coverage; pins record validated direct dependencies.
# CUDA wheels are explicit; this is not a complete transitive dependency lock.
name: teleoperation
channels:
  - defaults
dependencies:
  - python=3.10.20
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - -r requirements-dev.txt
      - -r requirements-retargeting-camera.txt
      - numpy==1.26.4
      - scipy==1.13.1
      - h5py==3.16.0
      - pybullet==3.2.7
      - torch==2.14.1+cu130
      - torchvision==0.29.1+cu130
      - einops==0.8.2
      - timm==1.0.30
      - urchin==0.0.30
      - trimesh==5.1.1
      - tensorboard==2.21.0
      - matplotlib==3.10.9
      - opencv-contrib-python==4.11.0.86
      - roboticstoolbox-python==1.4.2
      - spatialmath-python==1.1.18
      - mediapipe==0.10.35
